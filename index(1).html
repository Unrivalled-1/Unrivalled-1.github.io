<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Compile Log</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="app-css">
:root {
  --bg: #07050d;
  --bg-grad-1: #0b0714;
  --bg-grad-2: #0e0616;
  --glass-1: rgba(12, 10, 22, 0.22);
  --glass-2: rgba(12, 10, 22, 0.40);
  --glass-3: rgba(12, 10, 22, 0.54);
  --glass-border: rgba(255, 255, 255, 0.14);
  --glass-hi: rgba(255, 255, 255, 0.15);
  --glass-shadow: 0 20px 60px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
  --frost-blur: 22px;
  --prism: var(--primary);
  --primary: #e94560;
  --primary-hover: #ff4d6d;
  --primary-glow: rgba(233, 69, 96, 0.65);
  --on-primary: #2a0810;
  --secondary: #c4a8ff;
  --secondary-glow: rgba(167, 139, 250, 0.5);
  --text: #e2e8ff;
  --text-muted: #8892b0;
  --text-faint: #5f6785;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
body { position: relative; min-height: 100vh; overflow-x: hidden; }
a { color: inherit; }
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse 55% 40% at 12% 0%, var(--bg-grad-1) 0%, transparent 42%),
              radial-gradient(ellipse 45% 35% at 92% 100%, var(--bg-grad-2) 0%, transparent 42%),
              var(--bg);
}
#firefly-field { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.firefly {
  position: absolute; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, var(--ff-color, var(--primary)) 40%, transparent 80%);
  opacity: var(--ff-op, 0.85); will-change: transform, opacity;
  animation: ff-wander var(--ff-dur, 40s) ease-in-out infinite alternate, ff-pulse var(--ff-pulse, 12s) ease-in-out infinite;
  animation-delay: var(--ff-delay, 0s), var(--ff-pdelay, 0s);
}
@media (prefers-reduced-motion: reduce) { .firefly { animation: none; } }
@keyframes ff-wander {
  0% { transform: translate(0, 0) scale(0.8); }
  25% { transform: translate(var(--ff-x1, 40px), var(--ff-y1, -30px)) scale(1.2); }
  50% { transform: translate(var(--ff-x2, -50px), var(--ff-y2, 40px)) scale(0.9); }
  75% { transform: translate(var(--ff-x3, 30px), var(--ff-y3, 50px)) scale(1.3); }
  100% { transform: translate(var(--ff-x4, -40px), var(--ff-y4, -20px)) scale(0.85); }
}
@keyframes ff-pulse { 0%, 100% { opacity: calc(var(--ff-op, 0.85) * 0.6); } 50% { opacity: var(--ff-op, 0.85); } }
/* Faint static scanline texture — a CRT touch, always on but subtle, no motion. */
body::after {
  content: ''; position: fixed; inset: 0; z-index: 2; pointer-events: none;
  background-image: repeating-linear-gradient(to bottom, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 3px);
}
/* One-time "power on" flicker on load — plays once, never loops. */
html::before {
  content: ''; position: fixed; inset: 0; z-index: 999; pointer-events: none;
  background: #eef2ff; opacity: 0;
  animation: boot-flicker 650ms steps(1, end) 1;
}
@keyframes boot-flicker {
  0% { opacity: 0.85; } 6% { opacity: 0.05; } 12% { opacity: 0.5; }
  20% { opacity: 0; } 34% { opacity: 0.18; } 46% { opacity: 0; } 100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { html::before { animation: none; opacity: 0; } }
.wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 0 24px 100px; }
header { display: flex; align-items: center; justify-content: space-between; padding: 40px 0 0; }
.brand { display: flex; align-items: center; gap: 12px; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 16px; letter-spacing: 0.04em; text-decoration: none; color: var(--text); }
.brand .dot { width: 9px; height: 9px; border-radius: 0; background: var(--prism); box-shadow: 0 0 12px var(--primary-glow); flex: none; }
.brand [data-f="site-title"]::before, .side-brand [data-f="site-title"]::before { content: '['; color: var(--text-faint); font-weight: 500; }
.brand [data-f="site-title"]::after, .side-brand [data-f="site-title"]::after { content: ']'; color: var(--text-faint); font-weight: 500; }
nav a { font-family: 'JetBrains Mono', monospace; font-size: 13.5px; letter-spacing: 0.02em; color: var(--text-muted); text-decoration: none; }
.prism-strip { height: 3px; margin-top: 22px; border-radius: 0; background: var(--prism); opacity: 0.45; box-shadow: 0 0 14px -2px var(--primary-glow); }
.hero { padding: 52px 0 44px; }
.hero h1 { font-family: 'JetBrains Mono', monospace; font-size: clamp(36px, 7.5vw, 60px); font-weight: 800; letter-spacing: -0.01em; line-height: 1.08; color: var(--text); }
.hero-cursor { color: var(--secondary); animation: cursor-blink 1s steps(1, end) 5; }
@keyframes cursor-blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .hero-cursor { animation: none; } }
.hero p { margin-top: 14px; font-size: 16px; line-height: 1.6; color: var(--text-muted); max-width: 50ch; }
.glass-panel { position: relative; background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%), var(--glass-2); border: 1px solid var(--glass-border); border-radius: 0; overflow: hidden; backdrop-filter: blur(var(--frost-blur)) saturate(130%); -webkit-backdrop-filter: blur(var(--frost-blur)) saturate(130%); box-shadow: var(--glass-shadow); transition: border-color 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out), transform 0.3s var(--ease-out); }
#bio { display: flex; align-items: center; gap: 18px; padding: 20px 24px; margin: 16px 0 48px; }
.avatar-photo { position: relative; z-index: 1; width: 52px; height: 52px; border-radius: 0; object-fit: cover; flex: none; border: 1px solid var(--glass-border); }
.avatar-initial { position: relative; z-index: 1; width: 52px; height: 52px; border-radius: 0; flex: none; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 19px; color: var(--on-primary); background: var(--primary); box-shadow: 0 6px 22px var(--primary-glow); }
#bio .kicker { position: relative; z-index: 1; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: var(--primary); text-transform: uppercase; }
#bio h2 { position: relative; z-index: 1; font-size: 18px; font-weight: 700; margin: 2px 0 6px; }
#bio p { position: relative; z-index: 1; font-size: 14.5px; line-height: 1.55; color: var(--text-muted); }
.feed { display: flex; flex-direction: column; gap: 26px; }
.post-card:hover { border-color: rgba(255,255,255,0.18); box-shadow: 0 24px 70px -14px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08) inset; transform: translateY(-3px); }
.post-card .thumb { width: 100%; max-height: 380px; object-fit: cover; display: block; border-bottom: 1px solid var(--glass-border); }
.post-card .inner { position: relative; z-index: 1; padding: 26px 28px 28px; }
.post-title { font-family: 'JetBrains Mono', monospace; font-size: 21px; font-weight: 700; letter-spacing: -0.005em; line-height: 1.3; margin-bottom: 14px; }
.post-title::before { content: '$ '; color: var(--text-faint); font-weight: 500; }
.post-summary { cursor: pointer; }
.post-summary:hover .post-title { color: var(--primary); }
.post-summary .tags { margin-top: 12px; }
.excerpt {
  margin-top: 10px; font-size: 15px; line-height: 1.6; color: var(--text-muted);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3;
  overflow: hidden;
}
.back-link {
  font: inherit; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--text-muted);
  background: none; border: none; padding: 0; margin-bottom: 18px; cursor: pointer; display: block;
}
.back-link:hover { color: var(--primary); }
.post-body { font-size: 15.5px; line-height: 1.7; opacity: 0.92; }
.post-body p { margin-bottom: 1em; }
/* Defensive: pasted content can carry inline colors from wherever it came from.
   Force everything back to the theme's readable text color except links. */
.post-body, .post-body :not(a) { color: var(--text) !important; background: none !important; }
.post-body a { color: var(--secondary) !important; text-decoration: underline; text-decoration-color: var(--secondary-glow); }
.tags { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 18px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); }
.tags .tag-link { font: inherit; color: var(--tag-text, var(--text-muted)); background: none; border: none; padding: 2px 1px; border-radius: 0; cursor: pointer; transition: background 0.15s ease, color 0.15s ease; }
.tags .tag-link:hover { background: rgba(255,255,255,0.06); color: var(--tag-text, var(--primary)); }
.tags .tag-link.active { background: rgba(255,255,255,0.08); color: var(--tag-text, var(--primary)); font-weight: 600; text-decoration: underline; text-decoration-color: var(--tag-border, var(--primary-glow)); }
.tag-rail { margin: 12px 0 40px; }
.tag-rail.hidden { display: none; }
.tag-rail-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: var(--text-faint); margin-bottom: 10px; }
.filter-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border: 1px solid var(--glass-border); border-radius: 0; background: rgba(255,255,255,0.03); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--text-muted); }
.filter-bar strong { color: var(--primary); font-weight: 600; }
.filter-bar button { font: inherit; color: var(--text-muted); background: none; border: 1px solid var(--glass-border); border-radius: 0; padding: 4px 12px; cursor: pointer; }
.filter-bar button:hover { color: var(--text); border-color: var(--primary-glow); }
.feed-empty { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-faint); padding: 20px 0; text-align: center; }
.meta { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--glass-border); font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); }
.log-stamp { color: var(--text-faint); }
footer { position: relative; z-index: 1; margin-top: 60px; padding-top: 20px; border-top: 1px solid var(--glass-border); font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-faint); text-align: center; }

/* Editor UI */
.edit-toggle {
  position: fixed; bottom: 22px; right: 22px; z-index: 50;
  font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600;
  color: var(--text); background: var(--glass-3); border: 1px solid var(--glass-border);
  padding: 10px 18px; border-radius: 0; cursor: pointer;
  backdrop-filter: blur(var(--frost-blur)); -webkit-backdrop-filter: blur(var(--frost-blur));
  box-shadow: var(--glass-shadow);
}
.edit-overlay {
  position: fixed; inset: 0; z-index: 100; background: rgba(3,2,8,0.65);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.edit-overlay.hidden { display: none; }
.hidden { display: none !important; }
.edit-card { position: relative; z-index: 1; width: 100%; max-width: 860px; max-height: 88vh; overflow-y: auto; padding: 28px; }
.edit-card h2 { font-size: 20px; margin-bottom: 4px; }
.edit-card .edit-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; }
.field-row { margin-bottom: 14px; }
.field-row label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.05em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
.field-row input, .field-row textarea {
  width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(196, 168, 255, 0.18);
  color: var(--text); border-radius: 0; padding: 9px 11px; font-family: 'Inter', sans-serif; font-size: 14px;
  transition: border-color 0.15s ease;
}
.field-row input:focus, .field-row textarea:focus { outline: none; border-color: var(--secondary-glow); }
.field-row textarea { resize: vertical; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.5; }
.field-row input[type=file] { padding: 6px 0; }
hr.sep { border: none; border-top: 1px solid var(--glass-border); margin: 20px 0; }
.post-editor-block { border: 1px solid var(--glass-border); border-radius: 0; padding: 16px; margin-bottom: 16px; background: rgba(255,255,255,0.02); }
.post-editor-block .remove-post-btn { float: right; }
.btn {
  font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600;
  color: var(--text); background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border);
  padding: 9px 16px; border-radius: 0; cursor: pointer; transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
}
.btn:hover { background: rgba(255,255,255,0.1); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); color: var(--on-primary); border: none; box-shadow: 0 4px 16px var(--primary-glow); }
.btn.primary:hover { background: var(--primary-hover); box-shadow: 0 6px 20px var(--primary-glow); }
.btn.danger { color: #ff9db3; }
.btn-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
#edit-status { font-size: 13px; color: var(--primary); min-height: 18px; margin-bottom: 8px; }

/* Password gate */
.pw-gate { max-width: 360px; }
.pw-error { font-size: 12.5px; color: #ff9db3; min-height: 16px; margin: 6px 0 4px; }

/* Tabs */
.edit-tabs { display: flex; gap: 4px; margin-bottom: 20px; padding: 4px; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 0; width: fit-content; }
.edit-tab-btn {
  font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 600; letter-spacing: 0.03em;
  color: var(--text-muted); background: none; border: none; padding: 7px 16px; cursor: pointer;
  border-radius: 0; transition: background 0.15s ease, color 0.15s ease;
}
.edit-tab-btn:hover { color: var(--text); }
.edit-tab-btn.active { color: var(--text); background: rgba(255,255,255,0.08); }
.edit-tab-panel.hidden { display: none; }

/* Rich text body editor */
.rte-toolbar { display: flex; gap: 6px; margin-bottom: 6px; }
.rte-btn {
  font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text); background: rgba(255,255,255,0.06);
  border: 1px solid var(--glass-border); border-radius: 0; width: 30px; height: 28px; cursor: pointer;
}
.rte-btn:hover { background: rgba(255,255,255,0.12); }
.p-body-editor {
  width: 100%; min-height: 130px; max-height: 300px; overflow-y: auto; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(196, 168, 255, 0.18); color: var(--text); border-radius: 0; padding: 10px 12px;
  font-family: 'Inter', sans-serif; font-size: 14.5px; line-height: 1.6;
}
.p-body-editor:focus { outline: none; border-color: var(--secondary-glow); }
.p-body-editor p { margin-bottom: 0.8em; }
.p-body-editor, .p-body-editor :not(a) { color: var(--text) !important; background: none !important; }
.p-body-editor a { color: var(--secondary) !important; text-decoration: underline; }
.p-body-editor img { max-width: 100%; border-radius: 0; margin: 6px 0; display: block; }
.word-count { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-faint); margin-top: 5px; text-align: right; }
.rte-hint { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-faint); margin-top: 2px; }

/* Paste zones (Ctrl+V image paste) */
.paste-zone {
  font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-faint);
  border: 1px dashed var(--glass-border); border-radius: 0; padding: 10px 12px; margin-bottom: 8px;
  cursor: text; transition: border-color 0.15s ease, color 0.15s ease;
}
.paste-zone:focus, .paste-zone:hover { border-color: var(--primary-glow); color: var(--text-muted); outline: none; }
.paste-zone.has-image { border-style: solid; border-color: var(--primary-glow); color: var(--primary); }
.paste-preview { max-width: 140px; max-height: 90px; border-radius: 0; display: block; margin: 8px 0; border: 1px solid var(--glass-border); }

/* Sidebar (wide viewports only — a floating nav rail, like the app it's modeled on) */
#sidebar {
  position: fixed; left: 32px; top: 120px; width: 192px; z-index: 5;
  padding: 18px 16px; display: none;
}
.side-brand {
  display: flex; align-items: center; gap: 9px; font-family: 'JetBrains Mono', monospace;
  font-weight: 600; font-size: 13px; color: var(--text); margin-bottom: 18px;
}
.side-brand .dot { width: 8px; height: 8px; border-radius: 0; background: var(--prism); box-shadow: 0 0 11px var(--primary-glow); flex: none; }
.side-nav { display: flex; flex-direction: column; gap: 4px; }
.side-link {
  font: inherit; text-align: left; font-family: 'JetBrains Mono', monospace; font-size: 13px;
  color: var(--text-muted); background: none; border: none; padding: 8px 10px; border-radius: 0;
  cursor: pointer; transition: background 0.15s ease, color 0.15s ease;
}
.side-link:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.side-link.active { color: var(--primary); background: rgba(255,255,255,0.08); font-weight: 600; }
@media (min-width: 1180px) { #sidebar { display: block; } }

/* Header nav (mobile/narrow fallback for the same view-switching) */
nav.top-nav { display: flex; align-items: center; gap: 10px; }
nav.top-nav .nav-sep { color: var(--text-faint); }
nav.top-nav a { cursor: pointer; }
nav.top-nav a.active { color: var(--primary); }

/* About Me panel */
#about-panel { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding: 32px 28px; margin-bottom: 40px; }
#about-panel.hidden { display: none; }
#about-panel .avatar-photo, #about-panel .avatar-initial { width: 84px; height: 84px; font-size: 28px; }
#about-panel .kicker { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: var(--primary); text-transform: uppercase; }
#about-panel h2 { font-size: 26px; font-weight: 700; margin: 10px 0 14px; }
#about-panel p { font-size: 15.5px; line-height: 1.7; color: var(--text-muted); max-width: 56ch; }
</style>
</head>
<body>

38R/4DXc6X8KfAtnYGz/sU3h/5aTXExMh4I6jbjr2rqdH0nTtHtja6XZW9nCOsaJ1/3j3oAu0UUUAFYnjzUbLR/B+raheRW9zBHbN+5mTdHKTwsZB6guQK26o69pNlrmk3Gl6nH5lpMn7xPTHKke4IBoA+J3OTTa9H+K3w51Hwo32+P7Pc6Vu/4+E/dyAseBJHnGf9zj6V5xQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQA9QM/NX2R+z7Hp3wo+GEcnijy9OvvEkhu3eZNyx20f+rDkcYPJ698feFfO3wA8JReM/ihpmjXBxAW3vz6dP15/Cun/an+IVt4w8ePpWhxi30DSv8ARrWPytm5lJDHHYbv5Z9KAL/xj+PuteI5Z9D8L3t5p/h/d+8fzCs996+YRgheSNnpXnng7xhrOiWupaZo9/JZQ6tYSWVxsRXV0ZSCjKQflYcE/j2rjokd/ufzrZsYJrKKPU/JgubcTLDJ8zfK+CfLI4zwPccdaAPqj9kLx5eeG9Q0rwpqEsv2G7UW91C+cQTO58px6dQh7Y7/ACBa+nNT0/UfDnig6/oVtJd6XqMqjW7BOsbbcC9iyeWAAEkY5dQrL867ZPgbw54giudLurvR7eK21LTdPaaDYjxr5EW5pCMu6g88DH8I61+hnw+1yTxH4WtNUli2SEyQvsb5WkicxyFenG9GxkDigDG8deNv+EF1rTrvxAI4/CupSC2k1LounXJ+553byJOnmfwP975X+TQ+I/8AwkS+HxqfhNmn1LTZ1uxY79q6jGARJbk9i6k7G7OEPStPxh4f0rxR4Z1Hw5rcAuNN1CE28yH0bjI9GBwQexANfLHwX+Jep/Bn4k3XwT+JF/Lf6bbzxw6LqSZcwCQAxIyjJ8t1K4HPlnj7vKgHt3i+TSviH8NrHxf4clNwkcbTR/wybOksbjs6EcjsUIryKvT0ki+GvxiWANJ/wjfjy5O2JfmFlq+3LEDrsuEBYnnDx8431yfxE0MaB4ruLKIj7LOftEI/uo2ePwIIoA5yiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKAP/9k=","body":"<p><em>Illustration: The Verge</em></p><p>The Attention Economy is a side effect of capitalism. Since a company can make money off of your attention through advertisements and changing your opinions they will do what's in their power to obtain as much of it as possible. The advantage we have is no app can truly steal our attention but rather trick us into spending it. The tech companies are still at fault though since We make the decisions at every step even if those decisions are made automatically. Additionally there is a sense in which the fact that everyone uses social media makes it very hard for one person to leave and creates a prisoners dilemma put on the users shoulders by the software companies. The truth is people rarely use agency which is a hard fact to face at the micro scale. The documentary indicates it can be difficult to make the decisions later on it can be effective to make sure to make decisions when you have full control of your mind.</p><p>Social media apps rely on dopamine cycles and you have to reset your dopamine receptors. In the end this can help individuals but in reality its a societal problem that requires societal change. It is a situation where the freedom of tech giants has reduced the freedom of everyone else. Since social media apps like this are so ubiquitous and reticular it would not be absurd to treat them as utilities and declare them public domain. Many times class action lawsuits have failed due to the scale and affluence of these companies. I see only either a re-composition of our legal system and nationalization of these tech giants as possible solutions to this issue. This does not mean for the government to control media but force the likes of TikTok and Instagram to be open source with interchangeable algorithms.</p><p>Critically now AI is an increasingly impactful source of media. It removes all interaction with other humans and replaces it with neural networks. While researching I found that Tristan Harris's <a href=\"https://www.humanetech.com/ai-roadmap\">nonprofit</a> has pivoted somewhat to AI safety. AI's ability to use the same manipulation social media apps do is central to this. Calling social media's feeding process an algorithm is actually underselling because its made of deep neural networks just like large language models(LLMs like ChatGPT.  In many ways they are one in the same since both are used to have a neural network feed you information from the internet in a palatable way, its just that LLMs also try to replace the Human creating content. They generate new content in every interaction. At some point from being trained directly on human feedback its possible they will get better than humans at interactions. Its easy to simplify LLMs to machines that <a href=\"https://kk.org/thetechnium/why-are-llms-smart/\">predict the next word</a> but the danger is that that only applies to models trained only on raw data, today's models are trained on more than just the next word they are trained on their entire response for accurate information, and appealing to a human reader. Both of these can be dangerous, and an autonomous agent that has mastered both after recursive self improvement poses significant risks to humans. It is possible to teach an LLMs on what humans already know but it is also possible to teach LLMs directly from reality as long as you have data that was sourced from somewhere other than the ai itself it could feasibly learn.</p>","tags":["Big Tech","Attention","Media"]},{"slug":"post-2-my-view","title":"My view","date":"August 2026","image":null,"body":"<p>I am Joseph Harless. I'm in this class because I am a major in the Computer Science and Journalism department. I get my information depending on the topic from other people, from social media, and from Google News. I like computers but am frustrated with most corporations that control it and stall innovation such as Apple and Microsoft. I support open source software. I think AI is incredibly dangerous and we should stop making it but we should also use it for good if it already exists to maximize the benefit. I am frustrated about how media has become less of a search for truth and more of a competition for the user's attention. Because all the power is centered in monopolies the people have no way to control what they see. I don't yet have most social media apps, and only use the ones I have for group chats. I think having a very connected world can be very beneficial when if we fix it with open source software. I have some experience in Java Script and Python. I have also experimented with vibe coding. I admire independent journalists and reliable papers that show the injustices of large countries. For example Al, Jazeera in Gaza and others in Ukraine showing the bad side of Russia, America and Israel. It's also admirable how they often <a href=\"https://www.nbcnews.com/world/gaza/year-israeli-strikes-killed-journalists-hospital-no-one-held-accountab-rcna594406\">risk their lives</a> in search of the truth which comes at a stark contrast to most of the world's media.</p><p>I am concerned about a world that is so connected because it can create more polarization which can be destabilizing to the government. AI can make this more so and is a topic I spend much thought on. On one hand I think existentially we should stop developing it for these reasons and more. In a sense AI agents are media. They are another algorithm that lets users index thoughts that have already been thought, but on the other hand there is a possibility of recursive self improvement which I think the world is far fewer concerned with than it should be. For example with AI, almost everyone is concerned to some extent but far fewer people know enough about it to know what to do. The algorithm is able to feed on clips like the fact that 50% of AI researchers believe that there is a 10% of human extinction but far less take the time to explain how it could happen why its concerning and why we should be worried now. Even I started my interest from you tube this <a href=\"https://www.youtube.com/watch?v=k_onqn68GHY&amp;t=622\">video</a> which dramatizes real research is what got me started. Similar to climate change, we need people to know what the problem actually is if we are able to resist it. With everyone connected ideas travel fast and fear travels faster. Similar to the AI issue its quite easy for elections to turn into popularity contests Fahrneit 451 style. The bright side is that all the facts are always out there somewhere. It just becomes a difficult task to interpret all the data.</p>","tags":["AI","Media","Algorithm","Journalism"]}]};</script>

  function wireFeedFilter() {

      if (postEl) postEl.classList.add('hidden');

  function buildFireflies() {
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var container = document.getElementById('firefly-field');
    if (!container) return;
    container.innerHTML = '';
    var rnd = function (a, b) { return a + Math.random() * (b - a); };
    // Deep, transparent rgba baked directly into the color (not just the
    // element opacity) so these read as coloured light/haze, not painted
    // circles with a white core.
    var PALETTE = [
      'rgba(180, 25, 55, 0.28)',
      'rgba(120, 20, 70, 0.22)',
      'rgba(120, 90, 200, 0.20)'
    ];
    var COUNT = reduceMotion ? 0 : 12;
    for (var i = 0; i < COUNT; i++) {
      var el = document.createElement('div');
      el.className = 'firefly';
      var size = Math.round(rnd(90, 220));
      el.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' + rnd(2, 96).toFixed(1) + '%;top:' + rnd(2, 96).toFixed(1) + '%;' +
        '--ff-color:' + PALETTE[i % PALETTE.length] + ';--ff-op:' + rnd(0.22, 0.42).toFixed(2) + ';--ff-dur:' + rnd(30, 50).toFixed(0) + 's;' +
        '--ff-delay:-' + rnd(0, 30).toFixed(0) + 's;--ff-pulse:' + rnd(8, 16).toFixed(1) + 's;--ff-pdelay:-' + rnd(0, 8).toFixed(1) + 's;' +
        '--ff-x1:' + rnd(-110, 110).toFixed(0) + 'px;--ff-y1:' + rnd(-110, 110).toFixed(0) + 'px;' +
        '--ff-x2:' + rnd(-110, 110).toFixed(0) + 'px;--ff-y2:' + rnd(-110, 110).toFixed(0) + 'px;' +
        '--ff-x3:' + rnd(-110, 110).toFixed(0) + 'px;--ff-y3:' + rnd(-110, 110).toFixed(0) + 'px;' +
        '--ff-x4:' + rnd(-110, 110).toFixed(0) + 'px;--ff-y4:' + rnd(-110, 110).toFixed(0) + 'px;';
      container.appendChild(el);
    }
  }

  function wordCount(el) {
    var words = (el.textContent || '').trim().split(/\s+/).filter(Boolean);
    return words.length;
  }

  /* Pull an image out of a clipboard paste event, if there is one.
     Returns true (and handles it async via cb) when it found one. */
  function handleImagePaste(e, cb) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return false;
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file' && items[i].type.indexOf('image/') === 0) {
        var file = items[i].getAsFile();
        if (file) {
          e.preventDefault();
          downscaleImage(file, cb);
          return true;
        }
      }
    }
    return false;
  }

  /* A click/focus target that accepts Ctrl+V image pastes and hands the
     resulting data URL to onImage(dataUrl). */
  function wireImagePasteZone(zone, onImage) {
    if (!zone) return;
    zone.addEventListener('click', function () { zone.focus(); });
    zone.addEventListener('paste', function (e) {
      var got = handleImagePaste(e, function (dataUrl) {
        zone.classList.add('has-image');
        zone.textContent = 'Image pasted ✓ — paste again to replace it';
        onImage(dataUrl);
      });
      if (!got) e.preventDefault(); // this zone is images-only; ignore stray text pastes
    });
  }

  function wireOneEditorBlock(block) {
    var removeBtn = block.querySelector('.remove-post-btn');
    if (removeBtn) removeBtn.addEventListener('click', function () { block.remove(); });

    var preview = block.querySelector('.paste-preview');
    function setHeaderImage(dataUrl) {
      block.querySelector('.p-image-data').value = dataUrl;
      if (preview) { preview.src = dataUrl; preview.classList.remove('hidden'); }
    }

    var imageInput = block.querySelector('.p-image-file');
    if (imageInput) imageInput.addEventListener('change', function (e) {
      var file = e.target.files[0];
      if (!file) return;
      downscaleImage(file, setHeaderImage);
    });
    wireImagePasteZone(block.querySelector('.paste-zone'), setHeaderImage);

    var bodyEditor = block.querySelector('.p-body-editor');
    var wcEl = block.querySelector('[data-wc]');
    if (bodyEditor && wcEl) {
      wcEl.textContent = wordCount(bodyEditor) + ' words';
      bodyEditor.addEventListener('input', function () { wcEl.textContent = wordCount(bodyEditor) + ' words'; });
      bodyEditor.addEventListener('paste', function (e) {
        var gotImage = handleImagePaste(e, function (dataUrl) {
          document.execCommand('insertImage', false, dataUrl);
          wcEl.textContent = wordCount(bodyEditor) + ' words';
        });
        if (gotImage) return;
        // Plain text/HTML paste: insert as plain text only, so formatting and
        // colors from wherever it was copied (Word, Docs, a webpage) can't
        // sneak in and override the site's theme.
        e.preventDefault();
        var text = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
        document.execCommand('insertText', false, text);
        wcEl.textContent = wordCount(bodyEditor) + ' words';
      });
    }
    block.querySelectorAll('.rte-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var cmd = btn.getAttribute('data-cmd');
        if (!bodyEditor) return;
        bodyEditor.focus();
        try {
          if (cmd === 'link') {
            var url = window.prompt('Link URL:', 'https://');
            if (url) document.execCommand('createLink', false, url);
          } else {
            document.execCommand(cmd, false, null);
          }
        } catch (err) { /* execCommand unsupported — ignore, toolbar is a nicety */ }
        if (wcEl) wcEl.textContent = wordCount(bodyEditor) + ' words';
      });
    });
  }

  function downscaleImage(file, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var maxW = 1200;
        var scale = Math.min(1, maxW / img.width);
        var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

    var head =
      '<meta charset="utf-8">\n' +

    return '<!doctype html>\n<html lang="en">\n<head>\n' + head + '\n</head>\n<body>\n' +

  async function doSave() {
    if (!validatePosts()) {
      setStatus('Every post needs a title and some body text before you can save.');
      return;
    }
    finishSave();
  }

  /* Triggers a real browser download of the freshly generated document.
     Used when there's no Claude artifact runtime to publish through (e.g.
     this site hosted on GitHub Pages) — replaces window.claude.use('artifact')
     with "here's your updated index.html, go commit it". */
  function downloadGeneratedFile(html) {
    var blob = new Blob([html], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'index.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  async function finishSave() {
    var newData = collectFormData();
    setStatus('Saving…');
    if (window.claude && window.claude.use) {
      try {
        var artifact = await window.claude.use('artifact');
        if (artifact) {
          await artifact.publish(renderFullDocument(newData));
          return; // A successful publish reloads this view automatically.
        }
      } catch (e) {
        var code = e && e.code;
        if (code === 'not_granted' || code === 'not_writer' || code === 'consent_required') {
          setStatus('You’re not authorized to edit this site.');
          try { document.getElementById('edit-toggle-btn').hidden = true; } catch (err) {}
          setTimeout(closeEditor, 900);
          return;
        } else if (code === 'conflict') {
          setStatus('Someone already saved a newer version — reloading…');
          return;
        } else {
          setStatus('Save failed: ' + (e && e.message ? e.message : 'unknown error'));
          return;
        }
      }
    }
    // No Claude artifact runtime here — hand back an updated index.html
    // instead of publishing automatically.
    try {
      downloadGeneratedFile(renderFullDocument(newData));
      setStatus('Downloaded index.html — replace it in your repo and push to publish.');
    } catch (err) {
      setStatus('Save failed: ' + (err && err.message ? err.message : 'unknown error'));
    }
  }

  function wireEdit() {
    var toggleBtn = document.getElementById('edit-toggle-btn');
    var addBtn = document.getElementById('add-post-btn');
    var saveBtn = document.getElementById('save-btn');
    var closeBtn = document.getElementById('close-edit-btn');
    var pwSubmitBtn = document.getElementById('pw-submit-btn');
    var pwCancelBtn = document.getElementById('pw-cancel-btn');
    var pwInput = document.getElementById('pw-input');
    if (toggleBtn) toggleBtn.addEventListener('click', openEditor);
    if (closeBtn) closeBtn.addEventListener('click', closeEditor);
    if (saveBtn) saveBtn.addEventListener('click', doSave);
    if (pwSubmitBtn) pwSubmitBtn.addEventListener('click', submitPassword);
    if (pwCancelBtn) pwCancelBtn.addEventListener('click', closeEditor);
    if (pwInput) pwInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitPassword(); });
    wireEditTabs();
    if (addBtn) addBtn.addEventListener('click', function () {
      var el = document.getElementById('posts-editor');
      var idx = el.querySelectorAll('.post-editor-block').length;
      el.insertAdjacentHTML('afterbegin', postEditorBlockHtml({ title: '', date: todayDateStr(), image: null, body: '', tags: [] }, idx));
      wireOneEditorBlock(el.querySelector('.post-editor-block'));
    });

    var avatarInput = document.getElementById('f-avatar');
    var avatarData = document.getElementById('f-avatar-data');
    var avatarPreview = document.getElementById('f-avatar-preview');
    function setAvatar(dataUrl) {
      if (avatarData) avatarData.value = dataUrl;
      if (avatarPreview) { avatarPreview.src = dataUrl; avatarPreview.classList.remove('hidden'); }
    }
    if (avatarInput) avatarInput.addEventListener('change', function (e) {
      var file = e.target.files[0];
      if (!file) return;
      downscaleImage(file, setAvatar);
    });
    wireImagePasteZone(document.getElementById('f-avatar-paste'), setAvatar);
  }

  function boot() {
    try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}
    renderPage(DATA);
    buildFireflies();
    wireEdit();
    wireFeedFilter();
    wireViewNav();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();</script>
</body>
</html>
